name: Test

# The tests, run by the latest released komp: what a user of the package has.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the latest released komp and toolchain
        run: |
          curl -fsSL https://github.com/komp-co/komp/releases/latest/download/install.sh | sh
          echo "$HOME/.kflat/bin" >> "$GITHUB_PATH"

      - name: Test
        run: komp test .
